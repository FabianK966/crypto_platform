# ===============================
# Application
# ===============================
spring.application.name=crypto-platform

# ===============================
# MariaDB Datasource
# ===============================
spring.datasource.url=jdbc:mariadb://localhost:3307/crypto_platform
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# CORS (falls du es manuell liest)
# ===============================
web.cors.allowed-origins=http://localhost:4200
web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
web.cors.allowed-headers=*

# ===============================
# Binance API
# ===============================
binance.api.base-url=https://api.binance.com
