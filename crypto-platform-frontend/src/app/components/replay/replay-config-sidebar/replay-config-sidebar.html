<!-- src/app/components/replay/components/replay-config-sidebar/replay-config-sidebar.component.html -->

<div class="config-sidebar">
  <div class="config-sidebar-inner">
    <div class="sidebar-header">
      <h2>📊 Backtesting</h2>
      <div class="status-badge" [ngClass]="isPlaying ? 'playing' : 'paused'">
        {{ isPlaying ? '▶️ Playing' : '⏸️ Paused' }}
      </div>
    </div>

    <div class="sidebar-fields">
      <div class="input-group">
        <label>Symbol</label>
        <p-select [options]="symbolOptions" [(ngModel)]="localSymbol" (ngModelChange)="onSymbolChange()" optionLabel="label" optionValue="value" placeholder="Select Symbol" [style]="{ width: '100%' }" appendTo="body" />
      </div>

      <div class="input-group">
        <label>Timeframe</label>
        <p-select [options]="availableIntervals" [(ngModel)]="localInterval" (ngModelChange)="onIntervalChange()" optionLabel="label" optionValue="value" placeholder="Select Timeframe" [style]="{ width: '100%' }" appendTo="body" />
      </div>

      <div class="input-group">
        <label>Start Date</label>
        <input type="date" [(ngModel)]="localStartDate" (ngModelChange)="onStartDateChange()" [max]="localEndDate" class="input-field" />
      </div>

      <div class="input-group">
        <label>End Date</label>
        <input type="date" [(ngModel)]="localEndDate" (ngModelChange)="onEndDateChange()" [min]="localStartDate" [max]="today" class="input-field" />
      </div>

      <div class="input-group">
        <label>Leverage</label>
        <p-select [options]="leverageOptions" [(ngModel)]="localLeverage" (ngModelChange)="onLeverageChange()" placeholder="Select Leverage" [style]="{ width: '100%' }" appendTo="body" />
      </div>

      <div class="input-group">
        <label>Indicators</label>
        <div class="ema-toggles">
          <button class="ema-toggle-btn" [ngClass]="{'active': showEma50}" (click)="toggleEma50.emit()">EMA 50</button>
          <button class="ema-toggle-btn" [ngClass]="{'active': showEma200}" (click)="toggleEma200.emit()">EMA 200</button>
        </div>
      </div>
    </div>

    <p-button label="Load Data" icon="pi pi-refresh" [loading]="loading" (onClick)="loadData.emit()" styleClass="load-btn-full" />

    @if (candlesLoaded) {
      <div class="candle-info">✅ {{ totalCandles }} candles loaded</div>
    }

    @if (error) {
      <div class="error-message">
        <i class="pi pi-exclamation-triangle"></i>
        {{ error }}
      </div>
    }
  </div>
</div>
