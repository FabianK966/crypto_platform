<!-- src/app/components/replay/replay.component.html -->

<div class="replay-container">
  @if (candlesLoaded()) {
    <app-replay-portfolio
      [selectedSymbol]="selectedSymbol"
      [currentPrice]="getCurrentPrice()"
      [isPlaying]="isPlaying()"
      [tradingService]="tradingService"
    />
  }

  <div class="main-row">
    <div class="chart-section">
      <div class="chart-header">
        <h3>{{ selectedSymbol }}/USDT - {{ getIntervalLabel() }}</h3>
        <div class="chart-info">
          @if (currentCandleIndex() > 0) {
            <span>Candle {{ currentCandleIndex() }} / {{ totalCandles() }}</span>
            <span class="separator">•</span>
            <span>{{ getCurrentDate() }}</span>
            <span class="separator">•</span>
            <span class="current-price-badge">$ {{ getCurrentPrice() | number:'1.2-2' }}</span>
          }
        </div>
      </div>

      <div #chartContainer class="chart-container"></div>

      @if (candlesLoaded()) {
        <div class="replay-controls">
          <p-button icon="pi pi-step-backward" (onClick)="reset()" [outlined]="true" severity="secondary" />
          <p-button icon="pi pi-backward" (onClick)="stepBackward()" [disabled]="currentCandleIndex() <= 1" [outlined]="true" severity="secondary" />
          <p-button [icon]="isPlaying() ? 'pi pi-pause' : 'pi pi-play'" (onClick)="togglePlay()" [label]="isPlaying() ? 'Pause' : 'Play'" severity="success" />
          <p-button icon="pi pi-forward" (onClick)="stepForward()" [disabled]="currentCandleIndex() >= totalCandles()" [outlined]="true" severity="secondary" />
          <p-button icon="pi pi-step-forward" (onClick)="skipToEnd()" [outlined]="true" severity="secondary" />

          <div class="speed-control">
            <label>Speed</label>
            <p-select [options]="speedOptions" [(ngModel)]="playbackSpeed" optionLabel="label" optionValue="value" [style]="{ width: '100px' }" appendTo="body" />
          </div>

          <div class="progress-bar-container">
            <div class="progress-bar">
              <div class="progress-fill" [style.width.%]="(currentCandleIndex() / totalCandles()) * 100"></div>
            </div>
          </div>
        </div>
      }
    </div>

    <app-replay-config-sidebar
      [availableSymbols]="availableSymbols()"
      [availableIntervals]="availableIntervals()"
      [selectedSymbol]="selectedSymbol"
      [selectedInterval]="selectedInterval"
      [startDate]="startDate"
      [endDate]="endDate"
      [today]="today"
      [selectedLeverage]="tradingService.selectedLeverage()"
      [showEma50]="showEma50()"
      [showEma200]="showEma200()"
      [loading]="loading()"
      [error]="error()"
      [candlesLoaded]="candlesLoaded()"
      [totalCandles]="totalCandles()"
      [isPlaying]="isPlaying()"
      (configChange)="onConfigChange($event)"
      (loadData)="loadReplayData()"
      (toggleEma50)="toggleEma50()"
      (toggleEma200)="toggleEma200()"
    />
  </div>
</div>
